name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Cheapest gate of all: does the library still compile on the oldest Elixir
  # mix.exs claims to support? It can't be a full test run — the visual suite
  # pulls in playwright_ex, which needs Elixir 1.18+ — but the claim is about
  # what a consumer needs, and a consumer only ever compiles lib/ and the two
  # runtime deps, both of which require ~> 1.15 themselves.
  compile-floor:
    name: compile (Elixir 1.15.8 / OTP 26.2.5)
    runs-on: ubuntu-latest
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26.2.5"
          elixir-version: "1.15.8"

      - run: mix deps.get --only prod
      - run: mix compile --warnings-as-errors

  # Fast gate: unit tests + SVG golden snapshots. No browser, no server.
  test:
    name: test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The ends of the range the suite can actually run on: playwright_ex
        # requires 1.18+, and compile-floor above covers 1.15.
        include:
          - elixir: "1.18.4"
            otp: "27.2"
          # Newest pair; the format and warning gates below are pinned to it.
          - elixir: "1.19.5"
            otp: "28.5.0.1"
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Restore deps/_build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get
      - run: mix deps.compile

      # Both of these are pinned to one version: formatter output and
      # deprecation warnings both differ across Elixir releases.
      - name: Check formatting
        if: matrix.elixir == '1.19.5'
        run: mix format --check-formatted

      - name: Compile without warnings
        if: matrix.elixir == '1.19.5'
        run: mix compile --force --warnings-as-errors

      # SVG gate + unit tests (excludes the browser-driven :visual suite).
      - run: mix test --exclude visual

  # Fuller-fidelity gate: real pixel screenshots via phoenix_test_playwright.
  # Runs in the official Playwright image so fonts/rendering match the committed
  # baselines (see test/visual_test.exs "Determinism").
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-noble
    env:
      MIX_ENV: test
      # erlef/setup-beam can't auto-detect the OS inside a container; the
      # Playwright "noble" image is Ubuntu 24.04.
      ImageOS: ubuntu24
    steps:
      - uses: actions/checkout@v4

      # The Playwright image is minimal and ships without unzip, which
      # setup-beam needs to unpack the Elixir precompiled archive.
      - name: Install unzip (required by setup-beam)
        run: apt-get update && apt-get install -y unzip

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5.0.1"
          elixir-version: "1.19.5"

      - name: Restore deps/_build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-visual-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-visual-

      - run: mix deps.get
      - run: mix deps.compile

      # phoenix_test_playwright drives the Node Playwright driver from ./assets.
      # Install it and a matching Chromium (browsers ship in the image, but this
      # keeps the npm package and browser build in lockstep).
      - name: Install Playwright
        run: |
          npm --prefix assets install playwright
          npx --prefix assets playwright install chromium

      # With no committed baseline for a chart, assert_screenshot saves the
      # current screenshot and passes, so the job is a seed run rather than a
      # gate. Say so in the run summary instead of passing quietly.
      - name: Check for committed baselines
        run: |
          if ! ls test/visual/baseline/*.png >/dev/null 2>&1; then
            echo "::warning title=Visual baselines not committed::test/visual/baseline/ has no PNGs, so this run seeds them. Download the visual-baselines artifact and commit it to turn the job into a gate."
          fi

      - name: Visual tests
        run: mix test --only visual

      # Seeding is: commit the PNGs from this artifact of a green run of main.
      - name: Upload baselines
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: test/visual/baseline/*.png
          if-no-files-found: ignore

      - name: Upload actual + diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-artifacts
          path: |
            test/visual/actual/
            test/visual/baseline/__diff__/
          if-no-files-found: ignore
