name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast gate: unit tests + SVG golden snapshots. No browser, no server.
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          # Matches .tool-versions.
          otp-version: "28.5.0.1"
          elixir-version: "1.19.5"

      - name: Restore deps/_build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get
      - run: mix deps.compile

      # SVG gate + unit tests (excludes the browser-driven :visual suite).
      - run: mix test --exclude visual

  # Fuller-fidelity gate: real pixel screenshots via phoenix_test_playwright.
  # Runs in the official Playwright image so fonts/rendering match the
  # baselines (see test/visual_test.exs "Determinism").
  #
  # NOTE: test/visual/baseline/ holds no PNGs yet, so this job FAILS by design
  # (see EEXCHARTS_REQUIRE_BASELINE below). Seed the baselines with the
  # "Visual baselines" workflow and merge its PR to turn the gate green.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-noble
    env:
      MIX_ENV: test
      # Strict mode: a missing baseline is a failure, not a silent
      # seed-and-pass. Without this, an empty test/visual/baseline/ makes this
      # job re-seed on every run and pass unconditionally -- a gate that cannot
      # fail. Local runs leave it unset so they can still generate images.
      EEXCHARTS_REQUIRE_BASELINE: "1"
      # erlef/setup-beam can't auto-detect the OS inside a container; the
      # Playwright "noble" image is Ubuntu 24.04.
      ImageOS: ubuntu24
    steps:
      - uses: actions/checkout@v4

      # The Playwright image is minimal and ships without unzip, which
      # setup-beam needs to unpack the Elixir precompiled archive.
      - name: Install unzip (required by setup-beam)
        run: apt-get update && apt-get install -y unzip

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5.0.1"
          elixir-version: "1.19.5"

      - name: Restore deps/_build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-visual-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-visual-

      - run: mix deps.get
      - run: mix deps.compile

      # phoenix_test_playwright drives the Node Playwright driver from ./assets.
      # Install it and a matching Chromium (browsers ship in the image, but this
      # keeps the npm package and browser build in lockstep).
      - name: Install Playwright
        run: |
          npm --prefix assets install playwright
          npx --prefix assets playwright install chromium

      # Asserts against the committed baselines in test/visual/baseline/. Those
      # are produced by .github/workflows/visual-baselines.yml, which runs this
      # same suite in this same container with EEXCHARTS_REQUIRE_BASELINE unset
      # so assert_screenshot/3 writes the images, then opens a PR with them.
      - name: Visual tests
        run: mix test --only visual

      - name: Upload actual + diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-artifacts
          path: |
            test/visual/actual/
            test/visual/baseline/__diff__/
          if-no-files-found: ignore
